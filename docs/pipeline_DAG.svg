<rect x="345" y="252" width="270" height="44" rx="7" fill="#f5f5f3" stroke="#c9c6bf"/><text x="480" y="270" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">01p phold-proteins (array)</text><text x="480" y="286" font-size="10.5" fill="#6f6d67" text-anchor="middle">CPU default</text>
<rect x="345" y="312" width="270" height="44" rx="7" fill="#f5f5f3" stroke="#c9c6bf"/><text x="480" y="336" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">01p merge</text>
<path d="M480,236 L480,252" stroke="#7a7873" marker-end="url(#ah)"/><path d="M480,296 L480,312" stroke="#7a7873" marker-end="url(#ah)"/>

<rect x="650" y="192" width="270" height="44" rx="7" fill="#fdf7ec" stroke="#d8b877"/><text x="785" y="210" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">00n translate</text><text x="785" y="226" font-size="10.5" fill="#6f6d67" text-anchor="middle">nt CDS → protein · clean pang_ ids</text>
<rect x="650" y="312" width="270" height="44" rx="7" fill="#fdf7ec" stroke="#d8b877"/><text x="785" y="330" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">08 pangenome reference</text><text x="785" y="346" font-size="10.5" fill="#6f6d67" text-anchor="middle">rejoin → homology-ref set (after 04)</text>
