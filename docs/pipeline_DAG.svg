<path d="M600,128 L490,150" stroke="#7a7873" fill="none" marker-end="url(#ah)"/>
<path d="M690,128 L780,150" stroke="#7a7873" fill="none" marker-end="url(#ah)"/>

<rect x="40" y="192" width="270" height="44" rx="7" fill="#f5f5f3" stroke="#c9c6bf"/><text x="175" y="210" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">00c pharokka (array)</text><text x="175" y="226" font-size="10.5" fill="#6f6d67" text-anchor="middle">Phanotate calls CDS fresh</text>
<rect x="40" y="252" width="270" height="44" rx="7" fill="#f5f5f3" stroke="#c9c6bf"/><text x="175" y="270" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">01 phold (array)</text><text x="175" y="286" font-size="10.5" fill="#6f6d67" text-anchor="middle">3Di + PHROG annotation</text>
<rect x="40" y="312" width="270" height="44" rx="7" fill="#f5f5f3" stroke="#c9c6bf"/><text x="175" y="336" font-size="12.5" font-weight="600" fill="#2b2b29" text-anchor="middle">01c merge (+01d 3Di)</text>
<path d="M175,236 L175,252" stroke="#7a7873" marker-end="url(#ah)"/><path d="M175,296 L175,312" stroke="#7a7873" marker-end="url(#ah)"/>

