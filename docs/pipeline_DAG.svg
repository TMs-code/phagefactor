<svg viewBox="0 0 1200 980" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
<title>phageFACTor pipeline DAG</title>
<desc>Three input modes (genome, protein, pangenome) converge on a shared FoldSeek to compare to curate to output spine; step 02 forks into local and webAPI search.</desc>
<rect x="0" y="0" width="1200" height="980" fill="#ffffff"/>
<defs>
<marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7a7873"/></marker>
</defs>

<text x="40" y="40" font-size="21" font-weight="700" fill="#26251f">phageFACTor — pipeline DAG</text>
<text x="40" y="62" font-size="12.5" fill="#6f6d67">3 input modes · local vs webAPI search at step 02 · shared compare → curate → output spine</text>

<rect x="450" y="82" width="300" height="46" rx="7" fill="#eef2f6" stroke="#9db4cb"/>
<text x="600" y="102" font-size="13" font-weight="600" fill="#2b2b29" text-anchor="middle">detect_input_type.py</text>
<text x="600" y="118" font-size="10.5" fill="#6f6d67" text-anchor="middle">auto: genome · protein · pangenome</text>

